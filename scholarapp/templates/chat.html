{% load static %}
<style>

    .fit-text {
      width:max-content;
      margin:auto;
      flex:1;
    }

    .no-border {
        border-radius: 0 !important;
    }

    .card-header {
        height: 3.5rem;
    }

    .contact {
        background-color: #f8f8f8;
    }

    .contact:hover {
        background-color: #f4f4f4;
    }

    .selected {
        background-color: #f4f4f4;
    }

    .bottom-right-fixed {
        position: fixed;
        bottom: 30px;
        right: 25px;
        z-index: 1;
    }

    #chat-box {
        width: 30rem;
        height: 350px;
        bottom: 75px !important;
    }

    .scroll {
        height: 300px;
        overflow-y: scroll;
    }


    .hide-chat {
        position: relative;
        right: 30px;
        z-index: 2;
        top: 155px;
        background-color: #bab6b6;
    }

    .hide-chat:hover {
        background-color: #d2cece;
    }

  .message-footer {
  border-top: 1px solid #ddd;
  background: #eee;
  display: flex;
  padding-inline:5px;
  height: 60px;
  gap : 1rem;
  }
  .message-footer input:nth-child(1) {
    flex: 1;
    margin:auto;
    width: 160px;
    padding: 0 10px;
    border-radius: 5px;
    
  }

  .message {
    align-self: flex-start;
    max-width: 70%; 
    background: #f0f0f0;
    box-shadow: 0 5px 15px -5px rgba(0,0,0,.1);
    padding: 10px 5px;
    margin-bottom: 10px;
    border-radius: 10px;
  }

  .me {
    align-self: flex-end;
    background: #bde2f7;
    color: #111;
  }
</style>
<input type="hidden"
       id="user_id"
       data-user="{{ request.user.pk }}"
       data-csrf="{{ csrf_token }}">
</input>
<a id="chat_bubble"
   class="btn btn-primary bottom-right-fixed"
   role="button"
   onclick="document.querySelector('#chat-box').classList.remove('d-none')">
  <svg xmlns="http://www.w3.org/2000/svg"
       width="16"
       height="16"
       fill="currentColor"
       class="bi bi-chat"
       viewBox="0 0 16 16">
    <path d="M2.678 11.894a1 1 0 0 1 .287.801 11 11 0 0 1-.398 2c1.395-.323 2.247-.697 2.634-.893a1 1 0 0 1 .71-.074A8 8 0 0 0 8 14c3.996 0 7-2.807 7-6s-3.004-6-7-6-7 2.808-7 6c0 1.468.617 2.83 1.678 3.894m-.493 3.905a22 22 0 0 1-.713.129c-.2.032-.352-.176-.273-.362a10 10 0 0 0 .244-.637l.003-.01c.248-.72.45-1.548.524-2.319C.743 11.37 0 9.76 0 8c0-3.866 3.582-7 8-7s8 3.134 8 7-3.582 7-8 7a9 9 0 0 1-2.347-.306c-.52.263-1.639.742-3.468 1.105" />
  </svg>
</a>
<div id="chat-box" class="container card bottom-right-fixed d-none">
  <div class="row">
    <div class="card col p-0 no-border">
      <div class="card-header">
        <div class="form-outline">
          <input hx-post="/get_contacts"
                 hx-trigger="input changed delay:500ms, search"
                 hx-target="#contacts"
                 type="search"
                 name="chat_search"
                 id="chat_search"
                 class="form-control "
                 placeholder="Search" />
        </div>
        <a class="btn btn-sm p-0 bg-secondary hide-chat"
           onclick="document.querySelector('#chat-box').classList.add('d-none')"
           role="button">
          <svg xmlns="http://www.w3.org/2000/svg"
               width="24"
               height="24"
               fill="currentColor"
               class="bi bi-arrow-right-short"
               viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M4 8a.5.5 0 0 1 .5-.5h5.793L8.146 5.354a.5.5 0 1 1 .708-.708l3 3a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708-.708L10.293 8.5H4.5A.5.5 0 0 1 4 8" />
          </svg>
        </a>
      </div>
      <ul hx-post="/get_contacts"
          hx-trigger="load"
          hx-swap="innerHTML"
          id="contacts"
          class="list-group list-group-flush scroll">
      </ul>
    </div>
    <div class="card col-6 p-0 no-border">
      <div id="current_chat"
           class="card-header d-flex flex-row justify-items-start align items-start gap-2 p-1"
           style="line-height: 235%"></div>
      <div class="wrapper">
        <div id="messages" class="container p-3 d-flex flex-column scroll"></div>
        <div class="message-footer">
          <input name="message"
                 type="text"
                 autocomplete="off"
                 data-placeholder="Send a message to {0}"
                 placeholder="Send a message...">
          <button class="fit-text" type="submit" onclick="add_conversation()">Send</button>
        </div>
      </div>
    </div>
  </div>
</div>
