{% for contact,room_slug in contacts %}
    <li class="list-group-item contact"
        data-name="{{ contact.name }}"
        data-avatar="{{ contact.avatar }}"
        data-user="{{ contact.pk }}"
        data-conversation="{{ room_slug }}"
        onclick="select_chat(event.currentTarget)">
        <div class="d-flex flex-row gap-2">
            <a href="javascript:void(0)">
                <img class="avatar avatar-48 bg-light rounded-circle text-white p-1"
                     src="{{ contact.avatar }}"
                     alt="User Image">
            </a>
            <p style="line-height: 300%;">{{ contact.name }}</p>
        </div>
    </li>
{% endfor %}
