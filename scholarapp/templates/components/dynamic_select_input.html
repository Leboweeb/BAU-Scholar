{% extends "components/dynamic_base_input.html" %}
{% block inner_input %}
    <select class="select form-select" name="{{ top_label | as_id }} ">
        <option value="" {% if not existing_data %}selected{% endif %}>---------</option>
        {% for choice in choices %}
            <option value="{{ choice }}"
                    {% if existing_data.0 == choice %}selected{% endif %}>{{ choice | title }}</option>
        {% endfor %}
    </select>
{% endblock inner_input %}
