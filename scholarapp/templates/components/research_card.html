<div class="card">
    <div class="card-body" data-event-id="{{ event_id }}">
        {% if category %}
            <span class="text-muted d-block">{{ category }}</span>
            <div class="linebreak-underline my-3"></div>
        {% endif %}
        <div class="d-flex gap-1 overflow-scroll">
            <span class="badge rounded-pill bg-secondary event_type mb-3">{{ event_type }}</span>
            {% for tag in tags %}<span class="badge rounded-pill bg-secondary event_type mb-3">{{ tag }}</span>{% endfor %}
        </div>
        {% if can_participate %}
            <button class="btn btn-secondary btn-sm btn-participate"
                    title="Participate in Event"
                    onclick="participateInEvent(event)">
                {% if has_participated %}
                    <svg xmlns="http://www.w3.org/2000/svg"
                         width="16"
                         height="16"
                         fill="currentColor"
                         class="bi bi-person-check"
                         viewBox="0 0 16 16">
                        <path d="M12.5 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7m1.679-4.493-1.335 2.226a.75.75 0 0 1-1.174.144l-.774-.773a.5.5 0 0 1 .708-.708l.547.548 1.17-1.951a.5.5 0 1 1 .858.514M11 5a3 3 0 1 1-6 0 3 3 0 0 1 6 0M8 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4" />
                        <path d="M8.256 14a4.5 4.5 0 0 1-.229-1.004H3c.001-.246.154-.986.832-1.664C4.484 10.68 5.711 10 8 10q.39 0 .74.025c.226-.341.496-.65.804-.918Q8.844 9.002 8 9c-5 0-6 3-6 4s1 1 1 1z" />
                    </svg>
                {% else %}
                    <svg xmlns="http://www.w3.org/2000/svg"
                         width="16"
                         height="16"
                         fill="currentColor"
                         class="bi bi-person-add"
                         viewBox="0 0 16 16">
                        <path d="M12.5 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7m.5-5v1h1a.5.5 0 0 1 0 1h-1v1a.5.5 0 0 1-1 0v-1h-1a.5.5 0 0 1 0-1h1v-1a.5.5 0 0 1 1 0m-2-6a3 3 0 1 1-6 0 3 3 0 0 1 6 0M8 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4" />
                        <path d="M8.256 14a4.5 4.5 0 0 1-.229-1.004H3c.001-.246.154-.986.832-1.664C4.484 10.68 5.711 10 8 10q.39 0 .74.025c.226-.341.496-.65.804-.918Q8.844 9.002 8 9c-5 0-6 3-6 4s1 1 1 1z" />
                    </svg>
                {% endif %}
            </button>
        {% endif %}
        <h5 class="card-title">{{ title }}</h5>
        <p class="card-text">{{ description }}</p>
        <strong class="d-block mb-2">Authors</strong>
        <ul style="display: inline-flex;
                   list-style-type:none;
                   padding-left:0px;
                   gap:5px">
            {% for author in authors %}
                <li>
                    <a href="{% url "profile" author.pk %}">{{ author.name }}</a>
                </li>
            {% endfor %}
        </ul>
    </div>
</div>
