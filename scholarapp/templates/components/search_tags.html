<div class="flex-start-column gap-small">
    {% for tag in tags %}
        <li class="list-group-item">
            <button class="btn btn-secondary btn-sm"
                    type="button"
                    onclick="addPill(event, '{{ tag }}','#div_id_tags .badges', 'user','{{ tag.pk }}')">
                {{ tag }}
            </button>
        </li>
    {% endfor %}
</div>
