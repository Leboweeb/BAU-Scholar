<div class="d-table position-relative">
       <input hx-post="{{ endpoint }}"
              hx-trigger="input changed delay:500ms, search"
              hx-target="#{{ label | as_id }}_container"
              hx-swap="innerHTML"
              type="search"
              onclick="showDropDown('#{{ label | as_id }}_container')"
              name="{{ label | as_id }}"
              class="form-control"
              {% if required %}required=""{% endif %}
              style="max-width: 215px"
              placeholder="Search {{ label | title }}...">
       <svg xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            style="position: relative;
                   left: 195px;
                   bottom: 31px"
            onclick="hideDropDown('#{{ label | as_id }}_container')"
            fill="currentColor"
            class="bi bi-x cursor-pointer"
            viewBox="0 0 16 16">
              <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708" />
       </svg>
       <div class="my-3 row badges"
            style="display: flex;
                   gap: 0.175rem;
                   margin-left:0.05rem"></div>
       <div class="card p-2 w-100 d-none"
            id="{{ label | as_id }}_container"
            style="position: absolute;
                   top: {{ top }};
                   left: 0px;
                   right: 0px;
                   z-index: 2">
              <ul class="list-group list-group-flush scroll h-fit-content">
              </ul>
       </div>
</div>
