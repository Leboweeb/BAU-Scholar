{% extends "components/dynamic_base_input.html" %}
{% block inner_input %}
       <div class="d-table position-relative">
              <input name="hidden_{{ top_label|as_id }}"
                     type="hidden"
                     value="{{ existing_data |join:"•" }}">
       </input>
       <input hx-post="{{ endpoint }}"
              hx-trigger="input changed delay:500ms, search"
              hx-target="#{{ top_label | as_id }}_container"
              hx-swap="innerHTML"
              type="search"
              onclick="showDropDown('#{{ top_label | as_id }}_container')"
              name="{{ top_label | as_id }}"
              class="form-control"
              {% if required %}required=""{% endif %}
              style="max-width: 215px"
              placeholder="Search {{ top_label | title }}...">
       <svg xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            style="position: relative;
                   left: 195px;
                   bottom: 31px"
            onclick="hideDropDown('#{{ top_label | as_id }}_container')"
            fill="currentColor"
            class="bi bi-x cursor-pointer"
            viewBox="0 0 16 16">
              <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708" />
       </svg>
       <div class="my-3 row badges"
            style="display: flex;
                   gap: 0.175rem;
                   margin-left:0.05rem">
              {% if existing_data.0 %}
                     {% for tag in existing_data %}
                            <span class="badge rounded-pill bg-secondary w-fit-content"
                                  data-tag="{{ tag }}">{{ tag }}
                                   <svg onclick="removePill(event,'tag')"
                                        xmlns="http://www.w3.org/2000/svg"
                                        width="16"
                                        height="16"
                                        fill="currentColor"
                                        class="bi bi-x cursor-pointer"
                                        viewBox="0 0 16 16">
                                          <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708">
                                          </path>
                                   </svg>
                            </span>
                     {% endfor %}
              {% endif %}
       </div>
       <div class="card p-2 w-100 d-none"
            id="{{ top_label | as_id }}_container"
            style="position: absolute;
                   top: {{ top }};
                   left: 0px;
                   right: 0px;
                   z-index: 3">
              <ul class="list-group list-group-flush scroll h-fit-content">
              </ul>
       </div>
</div>
{% endblock inner_input %}
