<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet"
              integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
              crossorigin="anonymous" />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
                crossorigin="anonymous"></script>
        <title>{{ title }}</title>
    </head>
    <style>
    .center_to_page {
        width: 100vw;
        height: 100vh;
    }

    .lh-lg {
        line-height: 2.5rem !important;
    }

    form .form-text {
        display : none;
    }
    </style>
    <body>
        {% load crispy_forms_tags %}
        <div class="container d-flex justify-content-center align-items-center center_to_page">
            <div class="card" style="width: 65%; ">
                <div class="card-body">
                    <h4 class="card-title">{{ title }}</h4>
                    <form method="post" action="{% url endpoint %}">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ next }}">
                        {% comment %} <div class="alert alert-danger">{{ form.errors }}</div> {% endcomment %}
                        {{ form | crispy }}
                        {% comment %} <div class="d-flex flex-column gap-3 mb-3">
                            <!-- Email And Password Input Boxes -->
                            <div class="form-group">
                                <label for="email">Email address:</label>
                                <input type="email" class="form-control" name="email" id="email">
                            </div>
                            <div class="form-group">
                                <label for="pwd">Password:</label>
                                <input type="password" class="form-control" name="pwd" id="pwd">
                            </div>
                            <div class="checkbox">
                                <label>
                                    <input type="checkbox" name="checked">
                                    Remember me
                                </label>
                            </div>
                        </div>
                        {% endcomment %}
                        <!-- Bottom Panel of Signup form -->
                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary btn-block">{{ button_text }}</button>
                            <a class="float-end lh-lg" href="{% url other_url %}">{{ other_text }}</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </body>
    <script></script>
</html>
