{% extends "registration/password_reset_base.html" %}
{% load crispy_forms_tags %}
{% block password_page_content %}
    <h2 class="card-title">Password Reset Confirm</h2>
    <form method="post" enctype="multipart/form-data" class="mt-3">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary float-end w-25 mt-3">Send</button>
    </form>
{% endblock password_page_content %}
