{% extends "registration/password_reset_base.html" %}
{% block password_page_content %}
    <h4 class="card-title">Password Reset</h4>
    <form method="post" enctype="multipart/form-data" class="mt-3">
        {% csrf_token %}
        <div class="container">
            <div class="row">
                <label class="form-label requiredField m-0 mb-1 align-content-center p-0">
                    Email<span class="asteriskField">*</span>
                </label>
                <input class="pl-0"
                       type="email"
                       name="email"
                       id="email"
                       placeholder="name@example.com">
                <button type="submit" class="btn btn-primary float-end w-25 mt-3">Send</button>
            </div>
        </div>
    </form>
{% endblock password_page_content %}
