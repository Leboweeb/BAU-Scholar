<!-- templates/registration/password_reset_email.html -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Password Reset</title>
    </head>
    <body>
        <h1>Password Reset Request</h1>
        <p>Click the link below to reset your password:</p>
        <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}">Reset Password</a>
        <p>
            If you didn’t request a password reset, you can ignore this email, but please consider resetting your password as soon as possible for security.
        </p>
    </body>
</html>
